document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

px 12px;font-size:12px;font-weight:600;letter-spacing:.3px\">Viewing a read-only shared scout — editing is disabled (Ctrl+Shift+U to unlock)<\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showUnlockPrompt }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeUnlockPrompt }}\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:98;display:flex;align-items:center;justify-content:center\">\n      <div sc-camel-on-click=\"{{ stopClickPropagation }}\" style=\"background:#fff;border-radius:8px;padding:20px;width:280px;box-shadow:0 12px 32px rgba(0,0,0,.25)\">\n        <div style=\"font:800 14px 'Barlow Condensed',sans-serif;letter-spacing:.5px;color:#333;margin-bottom:10px\">UNLOCK EDITING<\u002Fdiv>\n        <input type=\"password\" value=\"{{ unlockInput }}\" sc-camel-on-change=\"{{ setUnlockInput }}\" sc-camel-on-key-down=\"{{ unlockKeyDown }}\" sc-camel-auto-focus=\"{{ true }}\" placeholder=\"Password\" style=\"width:100%;padding:8px 10px;border:1px solid rgba(0,0,0,.2);border-radius:5px;font-size:13px;margin-bottom:8px\">\n        <sc-if value=\"{{ unlockError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:11px;color:#a6192e;margin-bottom:8px\">Incorrect password<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ submitUnlock }}\" style=\"width:100%;background:#1c1c1c;color:#fff;border:none;border-radius:5px;padding:8px;font-size:12px;font-weight:700;cursor:pointer\">Unlock<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div data-single-only=\"true\" style=\"background:{{ teamColor2 }};color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n    <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:'Barlow Condensed',sans-serif\">\n      <div sc-camel-content-editable=\"{{ editable }}\" sc-camel-suppress-content-editable-warning=\"true\" sc-camel-on-blur=\"{{ updateOurTeam }}\" style=\"font-weight:800;font-size:30px;letter-spacing:.5px;flex:none\">{{ ourTeamName }}<\u002Fdiv>\n      <div sc-camel-content-editable=\"{{ editable }}\" sc-camel-suppress-content-editable-warning=\"true\" sc-camel-on-blur=\"{{ updateMatchLabel }}\" style=\"opacity:.6;font-size:20px;font-weight:600;flex:none\">{{ matchLabel }}<\u002Fdiv>\n      <image-slot id=\"{{ logoId }}\" style=\"width:64px;height:64px;flex:none;background:rgba(255,255,255,.08)\" shape=\"rounded\" radius=\"8\" fit=\"contain\" placeholder=\"Logo\"><\u002Fimage-slot>\n      <div sc-camel-content-editable=\"{{ editable }}\" sc-camel-suppress-content-editable-warning=\"true\" sc-camel-on-blur=\"{{ updateOpponent }}\" style=\"font-weight:800;font-size:30px;color:{{ teamColor1 }};min-width:0;max-width:360px;overflow-wrap:break-word\">{{ opponentName }}<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:3px;align-self:center\">\n        <span style=\"font-size:9px;opacity:.5;text-transform:uppercase;letter-spacing:.5px\">Result<\u002Fspan>\n        <sc-raw-select value=\"{{ matchResult }}\" sc-camel-on-change=\"{{ updateMatchResult }}\" disabled=\"{{ shareMode }}\" style=\"background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:4px 8px;font-size:13px;font-weight:700;min-width:120px\">\n          <option value=\"\" style=\"color:#111\">— Select —<\u002Foption>\n          <option value=\"Won in 3\" style=\"color:#111\">Won in 3<\u002Foption>\n          <option value=\"Won in 4\" style=\"color:#111\">Won in 4<\u002Foption>\n          <option value=\"Won in 5\" style=\"color:#111\">Won in 5<\u002Foption>\n          <option value=\"Lost in 3\" style=\"color:#111\">Lost in 3<\u002Foption>\n          <option value=\"Lost in 4\" style=\"color:#111\">Lost in 4<\u002Foption>\n          <option value=\"Lost in 5\" style=\"color:#111\">Lost in 5<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:3px;align-self:center\">\n        <span style=\"font-size:9px;opacity:.5;text-transform:uppercase;letter-spacing:.5px\">Type<\u002Fspan>\n        <sc-raw-select value=\"{{ matchType }}\" sc-camel-on-change=\"{{ updateMatchType }}\" disabled=\"{{ shareMode }}\" style=\"background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:4px 8px;font-size:13px;font-weight:700;min-width:130px\">\n          <option value=\"\" style=\"color:#111\">— Select —<\u002Foption>\n          <option value=\"Conference\" style=\"color:#111\">Conference<\u002Foption>\n          <option value=\"Non-Conference\" style=\"color:#111\">Non-Conference<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:3px;align-self:center\">\n        <span style=\"font-size:9px;opacity:.5;text-transform:uppercase;letter-spacing:.5px\">Date<\u002Fspan>\n        <input type=\"date\" value=\"{{ matchDate }}\" sc-camel-on-change=\"{{ updateMatchDate }}\" disabled=\"{{ shareMode }}\" style=\"background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:4px 8px;font-size:13px;font-weight:700;min-width:130px;color-scheme:dark\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n      <div data-noprint=\"true\" data-editor-only=\"true\" title=\"Autosave status\" style=\"display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.75)\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#4caf6d;flex:none\"><\u002Fspan>\n        <span style=\"white-space:nowrap\">{{ savedLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div data-noprint=\"true\" data-editor-only=\"true\" title=\"{{ syncErrorMsg }}\" style=\"display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.75)\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:{{ syncDotColor }};flex:none\"><\u002Fspan>\n        <span style=\"white-space:nowrap\">{{ syncLabel }}<\u002Fspan>\n        <sc-if value=\"{{ pushVisible }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"display:flex;align-items:center;gap:6px\">\n            <span style=\"width:7px;height:7px;border-radius:50%;background:{{ pushDotColor }};flex:none\"><\u002Fspan>\n            <span style=\"white-space:nowrap\">{{ pushLabel }}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ downloadData }}\" title=\"Download a backup JSON file\" style=\"background:none;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap\">Export Backup<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ triggerFileImport }}\" title=\"Load a scouting.json file\" style=\"background:none;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap\">Load File<\u002Fbutton>\n        <input type=\"file\" accept=\"application/json\" ref=\"{{ fileInputRef }}\" sc-camel-on-change=\"{{ handleFileImport }}\" style=\"display:none\">\n      <\u002Fdiv>\n      <div data-noprint=\"true\" data-editor-only=\"true\" style=\"display:flex;align-items:center;gap:6px\">\n        <span style=\"font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.5px\">Colors<\u002Fspan>\n        <input type=\"color\" value=\"{{ teamColor1 }}\" sc-camel-on-change=\"{{ updateColor1 }}\" style=\"width:24px;height:24px;border:none;padding:0;background:none;cursor:pointer\">\n        <input type=\"color\" value=\"{{ teamColor2 }}\" sc-camel-on-change=\"{{ updateColor2 }}\" style=\"width:24px;height:24px;border:none;padding:0;background:none;cursor:pointer\">\n      <\u002Fdiv>\n      <div data-noprint=\"true\" style=\"display:flex;align-items:center;gap:6px\">\n        <button sc-camel-on-click=\"{{ printCurrent }}\" style=\"background:{{ teamColor1 }};color:#fff;border:none;border-radius:5px;padding:6px 10px;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap\">Print This Scout<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ printAll }}\" style=\"background:none;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:6px 10px;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap\">Print All Scouts<\u002Fbutton>\n      <\u002Fdiv>\n      <div data-editor-only=\"true\" style=\"position:relative\">\n        <button sc-camel-on-click=\"{{ copyShareLink }}\" style=\"background:none;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:6px 10px;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap\">Copy Read-Only Link<\u002Fbutton>\n        <sc-if value=\"{{ shareToast }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;top:calc(100% + 6px);right:0;background:#111;color:#fff;font-size:11px;padding:5px 9px;border-radius:5px;white-space:nowrap;z-index:5\">Link copied<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-noprint=\"true\" style=\"position:relative;padding:12px 28px;background:#fff;border-bottom:1px solid rgba(0,0,0,.08)\">\n    <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n      <button sc-camel-on-click=\"{{ togglePicker }}\" style=\"{{ currentPillStyle }}\">\n        <span style=\"width:9px;height:9px;border-radius:50%;background:{{ teamColor1 }};flex:none\"><\u002Fspan>\n        <span>{{ opponentName }}<\u002Fspan>\n        <span style=\"opacity:.55;font-size:10px\">▾<\u002Fspan>\n      <\u002Fbutton>\n      <sc-for list=\"{{ recentChips }}\" as=\"rc\" hint-placeholder-count=\"0\">\n        <div sc-camel-on-click=\"{{ rc.select }}\" style=\"display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:#f0eee9;color:#333;white-space:nowrap\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:{{ rc.color }};flex:none\"><\u002Fspan>\n          <span>{{ rc.opponentName }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <button data-editor-only=\"true\" sc-camel-on-click=\"{{ addScout }}\" style=\"background:none;border:1px dashed rgba(0,0,0,.25);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;color:#333;white-space:nowrap\">+ New Scout<\u002Fbutton>\n      <button data-noprint=\"true\" sc-camel-on-click=\"{{ toggleOverview }}\" style=\"background:none;border:1px solid rgba(0,0,0,.15);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;color:#333;white-space:nowrap\">Season Overview<\u002Fbutton>\n      <button data-noprint=\"true\" data-editor-only=\"true\" sc-camel-on-click=\"{{ toggleMarkMode }}\" style=\"background:{{ markModeBtnBg }};color:{{ markModeBtnColor }};border:1px solid rgba(0,0,0,.15);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap\">{{ markModeLabel }}<\u002Fbutton>\n      <button data-noprint=\"true\" data-editor-only=\"true\" sc-camel-on-click=\"{{ toggleDrawMode }}\" title=\"Freehand draw with Apple Pencil, finger, or mouse\" style=\"background:{{ drawModeBtnBg }};color:{{ drawModeBtnColor }};border:1px solid rgba(0,0,0,.15);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap\">{{ drawModeLabel }}<\u002Fbutton>\n      <sc-if value=\"{{ markMode }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-noprint=\"true\" data-editor-only=\"true\" style=\"display:flex;align-items:center;gap:5px\">\n          <sc-for list=\"{{ markSwatches }}\" as=\"sw\" hint-placeholder-count=\"4\">\n            <div sc-camel-on-click=\"{{ sw.select }}\" title=\"Mark color\" style=\"width:20px;height:20px;border-radius:50%;background:{{ sw.color }};cursor:pointer;box-shadow:{{ sw.ringStyle }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"margin-left:auto;font-size:11px;color:rgba(0,0,0,.4);white-space:nowrap\">{{ scoutCountLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ overviewOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:12px;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:6px;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#fafafa;border-bottom:1px solid rgba(0,0,0,.08)\">\n          <div style=\"font:800 15px 'Barlow Condensed',sans-serif;letter-spacing:1px;color:#333\">SEASON OVERVIEW<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ printPage }}\" style=\"background:{{ teamColor1 }};color:#fff;border:none;border-radius:5px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer\">Print Summary<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr 1fr;font-size:10px;font-weight:800;color:rgba(0,0,0,.4);text-transform:uppercase;letter-spacing:.5px;padding:8px 14px;border-bottom:1px solid rgba(0,0,0,.06)\">\n          <div>Opponent<\u002Fdiv><div>Type<\u002Fdiv><div>Date<\u002Fdiv><div>Result<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ overviewRows }}\" as=\"row\" hint-placeholder-count=\"8\">\n          <div sc-camel-on-click=\"{{ row.select }}\" style-hover=\"background:#f7f6f3\" style=\"display:grid;grid-template-columns:2fr 1fr 1fr 1fr;align-items:center;padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.04)\">\n            <div style=\"display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600\">\n              <span style=\"width:8px;height:8px;border-radius:50%;background:{{ row.color }};flex:none\"><\u002Fspan>\n              <span>{{ row.opponentName }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"color:rgba(0,0,0,.6)\">{{ row.type }}<\u002Fdiv>\n            <div style=\"color:rgba(0,0,0,.6)\">{{ row.date }}<\u002Fdiv>\n            <div style=\"{{ row.resultStyle }}\">{{ row.result }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ overviewEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:20px;text-align:center;font-size:12px;color:rgba(0,0,0,.4)\">No scouts yet.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ pickerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ closePicker }}\" style=\"position:fixed;inset:0;z-index:40\"><\u002Fdiv>\n      <div style=\"position:absolute;top:56px;left:28px;width:340px;max-height:420px;background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:41;display:flex;flex-direction:column;overflow:hidden\">\n        <div style=\"padding:10px;border-bottom:1px solid rgba(0,0,0,.08)\">\n          <input type=\"text\" value=\"{{ scoutQuery }}\" sc-camel-on-change=\"{{ setScoutQuery }}\" placeholder=\"Search opponents…\" sc-camel-auto-focus=\"{{ true }}\" style=\"width:100%;padding:7px 10px;border:1px solid rgba(0,0,0,.15);border-radius:5px;font-size:13px\">\n        <\u002Fdiv>\n        <div style=\"overflow-y:auto;flex:1\">\n          <sc-for list=\"{{ filteredScouts }}\" as=\"fs\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ fs.select }}\" style=\"{{ fs.rowStyle }}\">\n              <span style=\"width:9px;height:9px;border-radius:50%;background:{{ fs.color }};flex:none\"><\u002Fspan>\n              <span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ fs.opponentName }}<\u002Fspan>\n              <sc-if value=\"{{ fs.hasResult }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size:10px;font-weight:700;color:rgba(0,0,0,.45);white-space:nowrap\">{{ fs.resultShort }}<\u002Fspan>\n              <\u002Fsc-if>\n              <button data-editor-only=\"true\" sc-camel-on-click=\"{{ fs.duplicate }}\" title=\"Duplicate as new scout\" style=\"background:none;border:none;color:rgba(0,0,0,.3);cursor:pointer;font-size:12px;padding:0 2px\">⧉<\u002Fbutton>\n              <sc-if value=\"{{ fs.canRemove }}\" hint-placeholder-val=\"{{ true }}\">\n                <button data-editor-only=\"true\" sc-camel-on-click=\"{{ fs.remove }}\" style=\"background:none;border:none;color:rgba(0,0,0,.3);cursor:pointer;font-size:12px;padding:0 2px\">✕<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noMatches }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:20px;text-align:center;font-size:12px;color:rgba(0,0,0,.4)\">No opponents match \"{{ scoutQuery }}\"<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div data-noprint=\"true\" style=\"padding:10px 28px;font-size:12px;color:rgba(0,0,0,.45)\">Click any text to edit. Use the + / ✕ buttons to add or remove rotations, rows, and players. Switch opponents above, or add a new scout for this week's match.<\u002Fdiv>\n\n  <div data-single-only=\"true\" style=\"padding:0 28px 14px\">\n    <div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:6px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;background:#fafafa;border-radius:6px 6px 0 0\" sc-camel-on-click=\"{{ toggleRoster }}\">\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <span style=\"font-size:10px;color:rgba(0,0,0,.4);display:inline-block;transform:{{ rosterArrowTransform }}\">▸<\u002Fspan>\n          <div style=\"font:800 15px 'Barlow Condensed',sans-serif;letter-spacing:1px;color:#333\">ROSTER<\u002Fdiv>\n        <\u002Fdiv>\n        <button data-noprint=\"true\" data-editor-only=\"true\" sc-camel-on-click=\"{{ addRosterItem }}\" style=\"background:{{ teamColor2 }};color:#fff;border:none;border-radius:5px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer\">+ Add Player<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ rosterOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:1px;background:rgba(0,0,0,.06);border-top:1px solid rgba(0,0,0,.08);border-radius:0 0 6px 6px;overflow:visible\">\n          <sc-for list=\"{{ rosterView }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div style=\"flex:0 0 130px;background:#fff;padding:10px;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:visible\" sc-camel-on-drag-over=\"{{ allowDrop }}\" sc-camel-on-drop=\"{{ p.onDrop }}\">\n              <div data-noprint=\"true\" data-editor-only=\"true\" draggable=\"true\" sc-camel-on-drag-start=\"{{ p.dragStart }}\" title=\"Drag to reorder\" style=\"position:absolute;top:4px;left:4px;cursor:grab;font-size:11px;color:rgba(0,0,0,.25)\">⠿<\u002Fdiv>\n              <button data-noprint=\"true\" data-editor-only=\"true\" sc-camel-on-click=\"{{ p.remove }}\" style=\"position:absolute;top:3px;right:3px;background:none;border:none;color:rgba(0,0,0,.25);cursor:pointer;font-size:11px\">✕<\u002Fbutton>\n              <image-slot id=\"{{ p.photoId }}\" style=\"width:88px;height:88px\" shape=\"rounded\" radius=\"8\" fit=\"cover\" placeholder=\"Headshot\"><\u002Fimage-slot>\n              <div sc-camel-content-editable=\"{{ editable }}\" sc-camel-suppress-content-editable-warning=\"true\" sc-camel-on-blur=\"{{ p.updateName }}\" style=\"font-weight:800;font-size:13px;text-align:center;color:#222;width:100%\">{{ p.name }}<\u002Fdiv>\n              <div sc-camel-content-editable=\"{{ e e' }));\n    this._saveTick = setInterval(() => this.forceUpdate(), 10000);\n    // Belt-and-suspenders: a refresh/close while a notes field is still\n    // focused can beat the onBlur handler to the punch. Read the live DOM\n    // text directly and write it straight to storage, bypassing React's\n    // setState timing entirely.\n    this._flushOnUnload = () => {\n      try {\n        const patches = {};\n        document.querySelectorAll('[data-notes-key]').forEach(el => {\n          patches[el.getAttribute('data-notes-key')] = el.innerText;\n        });\n        const scouts = this.state.scouts.map(sc => sc.id === this.state.activeScoutId ? { ...sc, ...patches } : sc);\n        const merged = { ...this.state, scouts };\n        localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));\n        const w = window.omelette && window.omelette.writeFile;\n        if (w) Promise.resolve(w(STATE_FILE, JSON.stringify(merged))).catch(() => {});\n      } catch (e) {}\n    };\n    window.addEventListener('pagehide', this._flushOnUnload);\n    window.addEventListener('beforeunload', this._flushOnUnload);\n    this.initJsonBinSync();\n    this._hotkeyHandler = (e) => this.handleHotkey(e);\n    window.addEventListener('keydown', this._hotkeyHandler);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._saveTick);\n    clearInterval(this._pollTimer);\n    clearTimeout(this._pushTimer);\n    window.removeEventListener('keydown', this._hotkeyHandler);\n  }\n\n  getActiveScout() { return this.state.scouts.find(sc => sc.id === this.state.activeScoutId) || this.state.scouts[0]; }\n\n  toggleMarkMode() { this.setState(s => ({ markMode: !s.markMode, drawMode: false })); }\n  toggleDrawMode() { this.setState(s => ({ drawMode: !s.drawMode, markMode: false })); }\n\n  copyLineup(idx) {\n    const arr = this.padLineups(this.getActiveScout().lineups);\n    this._lineupClipboard = { ...arr[idx] };\n    this._lineupClipboardIdx = idx;\n    this.forceUpdate();\n  }\n  pasteLineup(idx
